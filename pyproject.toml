[project]
name = "mscr"
version = "0.1.0"
description = "Local KRX stock, ETF screener and portfolio tracker"
requires-python = ">=3.12"
dependencies = [
  "pykrx==1.2.8",
  "finance-datareader>=0.9.202",
  "requests>=2.31",
  "websockets>=13",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.35",
  "typer>=0.16",
  "pydantic>=2",
  "pandas>=2.2,<3.0",
  "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mscr = "mscr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mscr"]
